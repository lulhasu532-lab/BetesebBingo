<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="app-container">
        <h2 style="text-align: center; color: #38bdf8;">እንኳን ወደ ቤተሰብ ቢንጎ መጡ! 👋</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 13px;">ለመጫወት ከታች ካሉት መደቦች አንዱን ይምረጡ</p>

        <!-- ባለ 10 ብር መደብ -->
        <div class="card">
            <div>
                <h3 style="margin: 0; color: #38bdf8;">ባለ 10 ብር መደብ</h3>
                <span style="font-size: 11px; color: #22c55e;">ሸልማት፡ ተጫዋቾች እንደገቡ የሚሰላ</span>
            </div>
            <button onclick="openRoom(10)" class="btn">ግባ ተጫወት</button>
        </div>

        <!-- ባለ 20 ብር መደብ -->
        <div class="card">
            <div>
                <h3 style="margin: 0; color: #38bdf8;">ባለ 20 ብር መደብ</h3>
                <span style="font-size: 11px; color: #22c55e;">ሸልማት፡ ተጫዋቾች እንደገቡ የሚሰላ</span>
            </div>
            <button onclick="openRoom(20)" class="btn">ግባ ተጫወት</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
